[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.coverage.run]
relative_files = true
omit = [
    ".venv/*",
    "*/.venv/*",
    ".quality/*",
    "*/.quality/*",
    "tests/*",
    "*/tests/*",
]

[tool.coverage.report]
fail_under = 70
show_missing = true

[tool.ruff]
target-version = "py310"
line-length = 100
exclude = ["outputs"]

[tool.ruff.lint]
select = ["E9", "F63", "F7", "F82"]

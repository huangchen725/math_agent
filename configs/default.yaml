# 默认配置（被 dev_mock.yaml / prod_real.yaml 继承覆盖）
llm:
  base_url: "https://chat.intern-ai.org.cn/api/v1/"
  model: "intern-s1"
  thinking_mode: true
  temperature: 0.7
  top_p: 0.95
  max_tokens: 32768
  rate_limit_per_min: 30
  max_retries: 5
  backoff_base: 1.5

paths:
  data_dir: "data"
  output_dir: "outputs"
  checkpoint_dir: "outputs/checkpoints"
  per_problem_dir: "outputs/per_problem"
  logs_dir: "outputs/logs"
  figures_dir: "outputs/figures"

pipeline:
  solver_max_turn: 6
  max_verify_retries: 3
  per_problem_timeout: 300
  self_consistency_samples: 1   # 初赛默认1，优化期调5

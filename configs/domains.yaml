# 18 个数学子领域 → 求解策略映射表
# solver: algebra | analysis | geometry | or  (对应 4 个领域 Solver)
# tools: sympy | numpy | plot （决赛 PluginMathCoder 接入；初赛靠 IPython 自写代码）
# verify: numerical | counterexample | dimension | boundary | dual
domains:
  # 代数与数论类
  abstract_algebra:
    solver: algebra
    tools: [sympy]
    verify: [counterexample]
  number_theory:
    solver: algebra
    tools: [sympy]
    verify: [numerical]
  linear_algebra:
    solver: algebra
    tools: [sympy, numpy]
    verify: [numerical]

  # 分析类
  real_analysis:
    solver: analysis
    tools: [sympy]
    verify: [numerical]
  complex_analysis:
    solver: analysis
    tools: [sympy]
    verify: [numerical]
  calculus:
    solver: analysis
    tools: [sympy]
    verify: [numerical]
  differential_equations:
    solver: analysis
    tools: [sympy, numpy]
    verify: [numerical, boundary]
  pde:
    solver: analysis
    tools: [sympy, numpy]
    verify: [numerical, boundary]
  functional_analysis:
    solver: analysis
    tools: [sympy]
    verify: [counterexample]
  measure_theory:
    solver: analysis
    tools: [sympy]
    verify: [counterexample]

  # 几何与拓扑类
  euclidean_geometry:
    solver: geometry
    tools: [plot, sympy]
    verify: [numerical]
  differential_geometry:
    solver: geometry
    tools: [sympy, numpy]
    verify: [numerical]
  topology:
    solver: geometry
    tools: [plot]
    verify: [counterexample]
  algebraic_geometry:
    solver: geometry
    tools: [sympy, plot]
    verify: [counterexample]

  # 运筹、概率、组合类
  operations_research:
    solver: or
    tools: [numpy]
    verify: [dual, numerical]
  probability:
    solver: or
    tools: [numpy, sympy]
    verify: [numerical]
  combinatorics:
    solver: or
    tools: [sympy]
    verify: [counterexample]
  discrete_math:
    solver: or
    tools: [sympy]
    verify: [counterexample]

# 兜底：未匹配领域用 analysis solver
default:
  solver: analysis
  tools: [sympy, numpy]
  verify: [numerical]
